name: Build Android APK (Koceng Oren)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        run: |
          git clone --depth 1 https://github.com/nurzenzayn-bot/KocengOren.git /home/runner/work/KocengOren/KocengOren
          cd /home/runner/work/KocengOren/KocengOren
          git sparse-checkout disable || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :android:assembleDebug --stacktrace --info

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: koceng-oren-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Release APK & AAB (Play Store beta)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :android:assembleRelease :android:bundleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: koceng-oren-release-apk
          path: android/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: koceng-oren-release-aab
          path: android/build/outputs/bundle/release/*.aab
          retention-days: 14
